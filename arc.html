<main>
  <section class="arc-card fade-in">
    <h2 class="center">Request an Advance Reader Copy</h2>
    <p class="center">Fill out the form below to request an ARC of an upcoming release. We'll review your request and send you a copy if selected.</p>

    <form id="arcRequestForm" action="#">
      <label for="name">Full Name<span class="required">*</span></label>
      <input type="text" id="name" name="name" placeholder="Your full name" required>

      <label for="email">Email<span class="required">*</span></label>
      <input type="email" id="email" name="email" placeholder="you@example.com" required>

      <label for="book">Book Request<span class="required">*</span></label>
      <select id="book" name="book" required>
        <option value="" disabled selected>Select a book</option>
        <option value="book1">M(us)e</option>
        <option value="book2">Shameless</option>
        <option value="book3">Primal</option>
      </select>

      <label for="copyType">Preferred Copy Type<span class="required">*</span></label>
      <select id="copyType" name="copyType" required>
        <option value="" disabled selected>Select copy type</option>
        <option value="ebook">Ebook</option>
        <option value="paperback">Paperback</option>
      </select>

      <label for="interest">Why are you interested in this title?<span class="required">*</span></label>
      <textarea id="interest" name="interest" rows="5" placeholder="Tell us why you want this ARC" required></textarea>

      <button type="submit">Submit Request</button>
    </form>

    <p id="formMessage"></p>
  </section>
</main>
